schema_version = "1.1"

[task]
name = "gamebench/super-mario-bros-singleplayer-gold"
description = "Build and exercise the original 32-level Rust platformer research environment and Harbor HTTP adapter"
authors = [{ name = "Josh Purtell", email = "jmvpurtell@gmail.com" }]
keywords = ["gamebench", "platformer", "rust", "visual-control", "harbor"]

[metadata]
category = "agent-evals"
difficulty_explanation = "Implement a deterministic fixed-point platformer with 32 authored courses, semantic events, checkpoints, RGB observations, and the documented HTTP rollout contract."

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
allow_internet = false
