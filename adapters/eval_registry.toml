schema_version = "1.0"

[families.code_policy_opt]
label = "code policy DEO hillclimb"
harbor_bundle = "code_policy_deo_hillclimb"

[[task]]
id = "tictactoe-multiplayer"
policy_suite = "defaults/policy_sweep/policy_dev_v1.json"
policy_baseline = "containers/codepolicy/heuristic_policy.py"
candidate_subdir = "tictactoe_mp"

