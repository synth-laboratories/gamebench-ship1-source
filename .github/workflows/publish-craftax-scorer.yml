name: Publish Craftax scorer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-craftax-scorer.yml
      - tasks/craftax-singleplayer/**

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-craftax-scorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GameBench
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 scorer
        id: scorer
        uses: docker/build-push-action@v6
        with:
          context: tasks/craftax-singleplayer
          file: tasks/craftax-singleplayer/containers/scorer_service/Dockerfile
          platforms: linux/amd64
          build-contexts: |
            gamebench_shared=tasks/shared
          build-args: |
            SCORER_BASE_IMAGE=python@sha256:28255a3ace7eb4c48bc1b57b90af29e1bc82b4fd6c60614a8e3dce61b87ff941
            SCORER_BUILDER_IMAGE=rust@sha256:b07b1bc9cb80ea8f48f304fe469feb759f54cfd30c6ec545a1b0ec3af822daf0
          tags: ghcr.io/synth-laboratories/gamebench-craftax-scorer:${{ github.sha }}
          push: true

      - name: Record immutable image authority
        env:
          IMAGE_DIGEST: ${{ steps.scorer.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "image=ghcr.io/synth-laboratories/gamebench-craftax-scorer@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
