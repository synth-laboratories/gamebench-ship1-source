name: Publish Craftax scorer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-craftax-scorer.yml
      - tasks/craftax-singleplayer/**

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-craftax-scorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GameBench
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 scorer
        id: scorer
        uses: docker/build-push-action@v6
        with:
          context: tasks/craftax-singleplayer
          file: tasks/craftax-singleplayer/containers/scorer_service/Dockerfile
          platforms: linux/arm64
          build-args: |
            SCORER_BASE_IMAGE=python@sha256:baf89808ec37adeaab83cec287adb4a2afa4a11c1d51e961c7ec737877e61af6
          tags: ghcr.io/${{ github.repository_owner }}/gamebench-craftax-scorer:${{ github.sha }}
          push: true

      - name: Record immutable image authority
        env:
          IMAGE_DIGEST: ${{ steps.scorer.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/gamebench-craftax-scorer@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
