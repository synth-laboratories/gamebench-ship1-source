[package]
name = "pokemon_emerald_littleroot_gold"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = "0.7"
base64 = "0.22"
flate2 = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }
