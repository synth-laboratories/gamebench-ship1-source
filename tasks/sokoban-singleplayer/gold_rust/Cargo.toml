[package]
name = "sokoban_gold"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "sokoban_gold"
path = "src/bin/sokoban_gold.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
