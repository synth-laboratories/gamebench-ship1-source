schema_version: gamebench.task_family.v1
id: settlers-multiplayer
name: Settlers Rules Multiplayer
kind: gamebench_gold_reference
game: settlers_rules
visibility: private
task_id: settlers-multiplayer
env_family: settlers-multiplayer
agent_count: 4
agents: [agent_0, agent_1, agent_2, agent_3]
turn_model: alternating
reward: per_player_vp_delta
victory_points_to_win: 10
scenario_dir: defaults/scenarios
fixture_dir: fixtures/gold
python_entrypoint: gold_python.engine:SettlersEnv
rust_crate: gold_rust
service_entrypoint: scripts/run_service.py
policy_runner: scripts/run_policy.py
policy_sweep_runner: scripts/run_policy_sweep.py
hillclimb_runner: scripts/run_hillclimb.py
parity_verifier: scripts/verify_python_rust_parity.py
fixture_generator: scripts/generate_gold_fixtures.py
fixture_verifier: scripts/verify_gold_fixtures.py
baseline:
  name: alphabeta_depth2_spirit
  entrypoint: policies.alphabeta_depth2:AlphaBetaDepth2Baseline
  reported_depth: 2
  ci_action_pruning: true
code_policy_deo:
  suite: defaults/policy_sweep/policy_dev_v1.json
  baseline: containers/codepolicy/heuristic_policy.py
  candidate_subdir: settlers
  candidate_agent: agent_0
  scoring_opponents: alphabeta_depth2_spirit
oracle:
  type: canonical_turn_nev_and_state
  eventlogs: fixtures/gold/eventlogs/eventlogs.json
  state_projections: fixtures/gold/states/states.json
status:
  reference_engine_python: tasks/settlers-multiplayer/gold_python/
  reference_engine_rust: tasks/settlers-multiplayer/gold_rust/
  implementation: dual_lane_owned_semantics
  deterministic_scenarios: 5
  upstream_runtime_dependency: none
