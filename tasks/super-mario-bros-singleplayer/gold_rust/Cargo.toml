[package]
name = "gamebench_platformer_gold"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.7"
base64 = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "super_mario_bros_service"
path = "src/bin/service.rs"

[workspace]
